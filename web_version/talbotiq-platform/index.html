    <!-- Archivo, variable, with its WIDTH axis (wdth 62–125) requested: the
         display voice is the same face widened to ~118, which is why this face
         was chosen over loading a second family. Chivo Mono carries machine
         values only. Figtree/Syne/DM Sans/Roboto removed with the violet system. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Chivo+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      THE RECORD — direction contract. Seed key 280773ba (direction roll, mode operate).

      THESIS: A hiring decision is a finding with its evidence attached. This
      workspace refuses the ATS default — white cards on grey, kanban columns, a
      donut of pipeline health — and is built as an evidence bundle instead.

      OWN-WORLD: Ink-dark navigational spine against a light cool record surface.
      Archivo, one family, width axis widened for display. Chivo Mono on machine
      values only. Squared geometry, hairline rules, real offset lifts. Colour is
      functional: six exhibit-tab colours encode the six interview formats;
      registrar ink #1D3FA0 is authority; seal red #B3261E is a terminal mark.
      No pills, no gradients on text, no eyebrows above headings.

      STORY: The recruiter arrives at a bundle index, sees every candidate as a
      filed record tabbed by interview format, compares scores in one column, and
      follows a citation to the exact transcript line that produced a score.

      FIRST VIEWPORT: Spine left (seven sections, ink ground). Record surface
      right. Sessions as the bundle index: one row per candidate, exhibit tab,
      tabular score, citation count. Primary action top-right of the record head.

      FORM: Legal evidence bundle / court transcript. Candidate 6 of the grounded
      list; assigned by the roll, chosen by the user over three challengers.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
