  </head>
  <body>
    <!--
      MIMIC — direction contract.

      THESIS: A hiring decision is a finding with its evidence attached. This
      product refuses the ATS default — white cards on grey, kanban columns, a
      donut of pipeline health — and is built as an evidence bundle instead.

      ONE SYSTEM, TWO GROUNDS. The same type scale, spacing rhythm, radii, motion
      and accent identity, painted on either of two grounds:

        THE RECORD (light)  A recruiter reading transcripts and scanning tables
                            for hours. Cool paper, ink type, hairline rules, no
                            glow. Legibility outranks drama.

        THE ROOM (dark)     A candidate in an interview, or a producer in Avatar
                            Studio. Near-black indigo, so the video feed, the
                            avatar or the voice orb is the brightest thing on
                            screen. Light is spent sparingly and always means
                            something.

      A subtree opts into the room with data-ground="room" and the whole palette
      follows. See src/design/tokens.css.

      OWN-WORLD: Archivo, one family, width axis widened for display. Chivo Mono
      on machine values only. Squared geometry, hairline rules, elevation that
      changes character with the ground. Colour is functional: six exhibit-tab
      colours encode the six interview formats; registrar ink is authority;
      violet marks machine output and nothing else; mint marks a live connection;
      seal red is a terminal mark. No pills, no gradients on text, no eyebrows
      above headings, and never colour as the only carrier of status.

      STORY: A candidate enters a calm, focused room that tells them where they
      are, what happens next and how much time is left. A recruiter arrives at a
      bundle index, sees every candidate as a filed record tabbed by interview
      format, compares scores in one column, and follows a citation to the exact
      transcript line that produced a score.

      FINISH: unreviewed and undocumented is unfinished.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
