name: talbotiq
description: "AI powered interview application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase — auth (email/password) + Firestore for the recruiter→candidate flow.
  # Run `flutterfire configure` to generate lib/firebase_options.dart and the
  # per-platform config; see lib/firebase_options.dart for the placeholder.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.22.0
  flutter_inappwebview: ^6.1.5 # desktop (Windows/macOS) video-interview WebView — webview_flutter has no desktop backend
  window_manager: ^0.4.3      # desktop window sizing/min-size/position persistence
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  record: ^6.1.1
  path_provider: ^2.1.4
  audioplayers: ^6.1.0
  file_picker: ^11.0.2
  pdf: ^3.11.1
  printing: ^5.13.3
  fl_chart: ^0.69.0        # recruiter analytics dashboard charts
  excel: ^4.0.6            # bulk candidate import from .xlsx
  web_socket_channel: ^3.0.1  # realtime voice track (Gemini Live) streaming
  app_links: ^6.3.0        # deep linking (candidate invite links)
  livekit_client: ^2.6.4  # two-way interview: same media engine as the web app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^3.1.0
  shared_preferences_platform_interface: ^2.4.2 # test-only: fakes a failing SharedPreferences write for recruiter_store_test.dart

flutter:
  uses-material-design: true

  assets:
    - assets/

  # Bundled, not fetched. AppTheme has always declared `fontFamily: 'Inter'`,
  # but no font asset shipped and there is no google_fonts dependency, so every
  # build silently fell back to the platform default — Roboto on Android, SF on
  # iOS and macOS, Segoe on Windows. The app therefore did not match the web
  # client, and did not match itself across platforms.
  #
  # Static instances rather than the variable face: Flutter's FontWeight does
  # not drive a variable weight axis consistently across platforms, so w600
  # would render at w400 on some of them.
  #
  # Chivo Mono is the machine-value face (scores, timers, IDs, timestamps) and
  # is the same family the web client uses. Both are SIL Open Font License 1.1
  # — see assets/fonts/OFL-NOTICE.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Chivo Mono
      fonts:
        - asset: assets/fonts/ChivoMono-400.ttf
          weight: 400
        - asset: assets/fonts/ChivoMono-600.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  # Generated from the brand mark by scripts/gen-icons.py, so the icon on a home
  # screen and the mark inside the app are the same path. Was assets/logo.jpg —
  # a photograph of the old wordmark, which had no transparent variant and so
  # had to be used as its own adaptive foreground on a white background.
  image_path: "assets/icon.png"

  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_background: "#141210"

  # The App Store rejects an icon with an alpha channel, and the mark is a
  # rounded plate on transparency. Flatten onto the plate's own ink so the
  # corners match the plate instead of the default white.
  remove_alpha_ios: true
  background_color_ios: "#141210"

  # Desktop too: the dock / taskbar icon is as visible as the phone one, and
  # both were still the old wordmark long after the app itself became Mimic.
  # web/ is left off deliberately — its icons (including the maskable variants)
  # are generated by scripts/gen-icons.py.
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon.png"
